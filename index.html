<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>昭和字律：復古喫茶店 (Prototype)</title>
    <style>
        :root {
            --bg-color: #f4ece1;
            --main-color: #8c2d19;
            --accent-color: #d99b26;
            --text-color: #362212;
            --card-bg: #fff8f0;
        }

        body {
            font-family: 'Courier New', Courier, monospace, "Microsoft JhengHei";
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--main-color);
            margin-bottom: 5px;
            text-shadow: 1px 1px 0px var(--accent-color);
        }

        .subtitle {
            font-size: 0.9rem;
            margin-bottom: 20px;
            color: #666;
        }

        .dashboard {
            display: flex;
            gap: 20px;
            background: var(--card-bg);
            padding: 10px 20px;
            border-radius: 12px;
            border: 2px solid var(--main-color);
            box-shadow: 4px 4px 0px var(--main-color);
            margin-bottom: 20px;
            font-weight: bold;
        }

        .game-container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            border: 3px solid var(--main-color);
            border-radius: 16px;
            box-shadow: 6px 6px 0px var(--main-color);
            padding: 20px;
            box-sizing: border-box;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--main-color);
            background: var(--bg-color);
            color: var(--text-color);
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--main-color);
            color: white;
            box-shadow: 2px 2px 0px var(--accent-color);
        }

        .game-panel {
            display: none;
            flex-direction: column;
            align-items: center;
            min-height: 280px;
        }

        .game-panel.active {
            display: flex;
        }

        /* 喫茶店模式 */
        .cafe-stage {
            width: 100%;
            text-align: center;
        }

        .customer-box {
            background: #e8d8c8;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            position: relative;
        }

        .order-speech {
            font-size: 1.2rem;
            color: var(--main-color);
            font-weight: bold;
            margin-top: 10px;
        }

        /* 音樂模式 */
        .record-player {
            width: 100px;
            height: 100px;
            background: #222;
            border-radius: 50%;
            border: 8px solid var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            animation: spin 3s linear infinite paused;
        }

        .record-player.playing {
            animation-play-state: running;
        }

        .record-center {
            width: 30px;
            height: 30px;
            background: var(--main-color);
            border-radius: 50%;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* 打字區域 */
        .target-word {
            font-size: 2rem;
            letter-spacing: 2px;
            margin: 15px 0;
            font-weight: bold;
        }

        .target-word .matched {
            color: #2e7d32;
            text-decoration: underline;
        }

        .target-word .unmatched {
            color: #888;
        }

        input[type="text"] {
            width: 80%;
            padding: 12px;
            font-size: 1.2rem;
            border: 2px solid var(--main-color);
            border-radius: 8px;
            text-align: center;
            outline: none;
            background: #fff;
        }

        .feedback {
            height: 24px;
            margin-top: 10px;
            font-weight: bold;
            color: var(--main-color);
        }

        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 10px;
            background: #e8d8c8;
            border-radius: 8px;
            margin-top: 10px;
        }

        .btn {
            background: var(--accent-color);
            border: 2px solid var(--main-color);
            padding: 8px 16px;
            color: white;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h1>☕ 昭和字律：復古喫茶店</h1>
    <div class="subtitle">Show Typing Kissaten — Prototype v0.1</div>

    <div class="dashboard">
        <div>💰 營業額: <span id="money">0</span> 円</div>
        <div>⭐ 正確率: <span id="accuracy">100</span>%</div>
        <div>🎵 已擁有黑膠: <span id="record-count">0</span> 張</div>
    </div>

    <div class="game-container">
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchMode('cafe')">🍮 喫茶店經營 (基礎)</button>
            <button class="tab-btn" onclick="switchMode('music')">🎷 黑膠唱片機 (進階音遊)</button>
        </div>

        <!-- 模式一：喫茶店經營 -->
        <div id="cafe-panel" class="game-panel active">
            <div class="cafe-stage">
                <div class="customer-box">
                    <div>👤 顧客：「你好！我想點這個：」</div>
                    <div class="order-speech" id="customer-order">Pudding</div>
                </div>
                <div class="target-word" id="cafe-target">
                    <!-- 動態渲染字母 -->
                </div>
                <input type="text" id="cafe-input" placeholder="請在此輸入英文..." autocomplete="off" autofocus>
                <div class="feedback" id="cafe-feedback"></div>
            </div>
        </div>

        <!-- 模式二：黑膠音遊 -->
        <div id="music-panel" class="game-panel">
            <div id="shop-view" style="width: 100%;">
                <p style="text-align: center;">唱片行（需用經營賺取的營業額購買黑膠）</p>
                <div class="shop-item">
                    <div>
                        <strong>📀 City Pop Single: "Plastic Love"</strong><br>
                        <small>難度：★★☆ | 價格：100 円</small>
                    </div>
                    <button class="btn" id="buy-btn" onclick="buyRecord()">購買黑膠</button>
                </div>
            </div>

            <div id="music-view" style="display: none; width: 100%; text-align: center;">
                <div style="display: flex; justify-content: center;">
                    <div class="record-player playing" id="record-player">
                        <div class="record-center"></div>
                    </div>
                </div>
                <div>🎵 正在播放：Plastic Love (City Pop)</div>
                <div class="target-word" id="music-target"></div>
                <input type="text" id="music-input" placeholder="跟著節奏打出歌詞..." autocomplete="off">
                <div class="feedback" id="music-feedback"></div>
            </div>
        </div>
    </div>

    <script>
        // 遊戲資料與狀態
        let money = 0;
        let totalTyped = 0;
        let correctTyped = 0;
        let hasRecord = false;

        // 喫茶店菜單 (單字/短語)
        const cafeOrders = [
            { text: "Pudding", reward: 30 },
            { text: "Melon Soda", reward: 50 },
            { text: "Black Coffee", reward: 40 },
            { text: "Hot Hot Hot Coffee", reward: 70 },
            { text: "I want a sweet Caramel Pudding please", reward: 120 }
        ];

        // 唱片歌詞 (句子)
        const lyrics = [
            "Don't worry about it",
            "I'm just playing games",
            "Dance to the plastic beat",
            "Showa Retro Night Cafe"
        ];

        let currentCafeIndex = 0;
        let currentMusicIndex = 0;

        // 初始化
        updateDisplay();
        loadCafeTarget();

        // 切換模式
        function switchMode(mode) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.game-panel').forEach(panel => panel.classList.remove('active'));

            if (mode === 'cafe') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('cafe-panel').classList.add('active');
                document.getElementById('cafe-input').focus();
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('music-panel').classList.add('active');
                if (hasRecord) {
                    document.getElementById('music-input').focus();
                }
            }
        }

        // --- 喫茶店邏輯 ---
        function loadCafeTarget() {
            const target = cafeOrders[currentCafeIndex].text;
            document.getElementById('customer-order').innerText = `"${target}"`;
            renderTarget('cafe-target', target, '');
            document.getElementById('cafe-input').value = '';
        }

        document.getElementById('cafe-input').addEventListener('input', (e) => {
            const input = e.target.value;
            const target = cafeOrders[currentCafeIndex].text;
            
            totalTyped++;
            if (target.startsWith(input)) {
                correctTyped++;
                renderTarget('cafe-target', target, input);
                document.getElementById('cafe-feedback').innerText = "";
                
                if (input === target) {
                    // 完成點餐
                    money += cafeOrders[currentCafeIndex].reward;
                    document.getElementById('cafe-feedback').innerText = `✨ 製作完成！賺取 ${cafeOrders[currentCafeIndex].reward} 円`;
                    currentCafeIndex = (currentCafeIndex + 1) % cafeOrders.length;
                    updateDisplay();
                    setTimeout(loadCafeTarget, 800);
                }
            } else {
                document.getElementById('cafe-feedback').innerText = "❌ 拼寫錯誤！注意大小寫與空格";
            }
            updateDisplay();
        });

        // --- 黑膠音遊邏輯 ---
        function buyRecord() {
            if (money >= 100) {
                money -= 100;
                hasRecord = true;
                updateDisplay();
                document.getElementById('shop-view').style.display = 'none';
                document.getElementById('music-view').style.display = 'block';
                loadMusicTarget();
            } else {
                alert("營業額不足！請先在喫茶店經營賺取 100 円。");
            }
        }

        function loadMusicTarget() {
            const target = lyrics[currentMusicIndex];
            renderTarget('music-target', target, '');
            document.getElementById('music-input').value = '';
            document.getElementById('music-input').focus();
        }

        document.getElementById('music-input').addEventListener('input', (e) => {
            const input = e.target.value;
            const target = lyrics[currentMusicIndex];

            totalTyped++;
            if (target.startsWith(input)) {
                correctTyped++;
                renderTarget('music-target', target, input);
                
                if (input === target) {
                    money += 50; // 音遊高額獎勵
                    document.getElementById('music-feedback').innerText = "🎶 PERFECT! 連擊加成 +50 円";
                    currentMusicIndex = (currentMusicIndex + 1) % lyrics.length;
                    updateDisplay();
                    setTimeout(loadMusicTarget, 600);
                }
            } else {
                document.getElementById('music-feedback').innerText = "🎵 MISS! 節奏打亂了";
            }
            updateDisplay();
        });

        // 渲染高亮文字
        function renderTarget(elementId, target, input) {
            const matched = target.substring(0, input.length);
            const unmatched = target.substring(input.length);
            document.getElementById(elementId).innerHTML = 
                `<span class="matched">${matched}</span><span class="unmatched">${unmatched}</span>`;
        }

        // 更新 UI 數據
        function updateDisplay() {
            document.getElementById('money').innerText = money;
            document.getElementById('record-count').innerText = hasRecord ? "1" : "0";
            
            const acc = totalTyped === 0 ? 100 : Math.round((correctTyped / totalTyped) * 100);
            document.getElementById('accuracy').innerText = acc;

            const buyBtn = document.getElementById('buy-btn');
            if (hasRecord) {
                buyBtn.innerText = "已擁有";
                buyBtn.disabled = true;
            } else if (money < 100) {
                buyBtn.innerText = "金幣不足 (100円)";
            } else {
                buyBtn.innerText = "購買黑膠";
            }
        }
    </script>
</body>
</html>
