    <script>
        let money = 0;
        let totalTyped = 0;
        let correctTyped = 0;
        let hasRecord = false;
        let audioCtx = null;
        let bgmInterval = null;

        const cafeOrders = [
            { text: "Pudding", label: "焦糖布丁", reward: 30 },
            { text: "Melon Soda", label: "冰淇淋蘇打", reward: 50 },
            { text: "Black Coffee", label: "黑咖啡", reward: 40 },
            { text: "Hot Coffee", label: "熱咖啡", reward: 40 },
            { text: "I want a sweet Caramel Pudding please", label: "請給我一份甜布丁", reward: 120 }
        ];

        const lyrics = [
            "Don't worry about it",
            "I'm just playing games",
            "Dance to the plastic beat",
            "Showa Retro Night Cafe"
        ];

        let currentCafeIndex = 0;
        let currentMusicIndex = 0;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playClickSound() {
            initAudio();
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch (e) {}
        }

        function playWinSound() {
            initAudio();
            if (!audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.08);
                osc.frequency.setValueAtTime(783.99, now + 0.16);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(now + 0.3);
            } catch (e) {}
        }

        function startBGM() {
            initAudio();
            if (!audioCtx || bgmInterval) return;
            const notes = [261.63, 329.63, 392.00, 493.88, 392.00, 329.63];
            let noteIdx = 0;
            bgmInterval = setInterval(() => {
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = notes[noteIdx];
                    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                    noteIdx = (noteIdx + 1) % notes.length;
                } catch (e) {}
            }, 300);
        }

        function stopBGM() {
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }

        // 綁定頁籤切換事件
        document.getElementById('btn-cafe').addEventListener('click', () => switchMode('cafe'));
        document.getElementById('btn-music').addEventListener('click', () => switchMode('music'));
        document.getElementById('buy-btn').addEventListener('click', buyRecord);

        function switchMode(mode) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.game-panel').forEach(panel => panel.classList.remove('active'));

            if (mode === 'cafe') {
                document.getElementById('btn-cafe').classList.add('active');
                document.getElementById('cafe-panel').classList.add('active');
                document.getElementById('cafe-input').focus();
                stopBGM();
                document.getElementById('record-player').classList.remove('playing');
            } else {
                document.getElementById('btn-music').classList.add('active');
                document.getElementById('music-panel').classList.add('active');
                if (hasRecord) {
                    document.getElementById('music-input').focus();
                    startBGM();
                    document.getElementById('record-player').classList.add('playing');
                }
            }
        }

        function loadCafeTarget() {
            const currentItem = cafeOrders[currentCafeIndex];
            document.getElementById('customer-order').innerText = `"${currentItem.text}" (${currentItem.label})`;
            renderTarget('cafe-target', currentItem.text, '');
            document.getElementById('cafe-input').value = '';
        }

        document.getElementById('cafe-input').addEventListener('input', (e) => {
            playClickSound();
            const input = e.target.value;
            const target = cafeOrders[currentCafeIndex].text;
            
            totalTyped++;
            if (target.startsWith(input)) {
                correctTyped++;
                renderTarget('cafe-target', target, input);
                document.getElementById('cafe-feedback').innerText = "";
                
                // 完全匹配時
                if (input === target) {
                    playWinSound();
                    money += cafeOrders[currentCafeIndex].reward;
                    document.getElementById('cafe-feedback').innerText = `✨ 製作完成！獲得 ${cafeOrders[currentCafeIndex].reward} 円`;
                    currentCafeIndex = (currentCafeIndex + 1) % cafeOrders.length;
                    updateDisplay();
                    setTimeout(loadCafeTarget, 600);
                }
            } else {
                document.getElementById('cafe-feedback').innerText = "❌ 請注意大小寫與空格哦！";
            }
            updateDisplay();
        });

        function buyRecord() {
            if (money >= 100) {
                money -= 100;
                hasRecord = true;
                updateDisplay();
                document.getElementById('shop-view').style.display = 'none';
                document.getElementById('music-view').style.display = 'block';
                loadMusicTarget();
                startBGM();
                document.getElementById('record-player').classList.add('playing');
            } else {
                alert("營業額不足！請先透過喫茶店經營賺取 100 円。");
            }
        }

        function loadMusicTarget() {
            const target = lyrics[currentMusicIndex];
            renderTarget('music-target', target, '');
            document.getElementById('music-input').value = '';
            document.getElementById('music-input').focus();

        document.getElementById('music-input').addEventListener('input', (e) => {

                correctTyped++;
                renderTarget('music-target', target, input);
                
                if (input === target) {
                    playWinSound();
                    money += 50;
                    document.getElementById('music-feedback').innerText = "🎶 PERFECT! 連擊加成 +50 円";
                    currentMusicIndex = (currentMusicIndex + 1) % lyrics.length;
                    updateDisplay();
                    setTimeout(loadMusicTarget, 600);
                }
            } else {
                document.getElementById('music-feedback').innerText = "🎵 MISS! 注意輸入字元";
            }
            updateDisplay();
        });

        function renderTarget(elementId, target, input) {
            const matched = target.substring(0, input.length);
            const unmatched = target.substring(input.length);
            document.getElementById(elementId).innerHTML = 
                `<span class="matched">${matched}</span><span class="unmatched">${unmatched}</span>`;
        }

        function updateDisplay() {
            document.getElementById('money').innerText = money;
            const acc = totalTyped === 0 ? 100 : Math.round((correctTyped / totalTyped) * 100);
            document.getElementById('accuracy').innerText = acc;

            const buyBtn = document.getElementById('buy-btn');
            if (hasRecord) {
                buyBtn.innerText = "已擁有";
                buyBtn.disabled = true;
            } else if (money < 100) {
                buyBtn.innerText = "營業額不足 (100円)";
            } else {
                buyBtn.innerText = "購買黑膠";
            }
        }

        // 頁面初始化
        updateDisplay();
        loadCafeTarget();
    </script>
</body>
</html>
