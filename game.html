<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>昭和字律：復古喫茶店 (Show Typing Kissaten)</title>
    <style>
        :root {
            --bg-color: #f4ece1;
            --main-color: #8c2d19;
            --accent-color: #d99b26;
            --text-color: #362212;
            --card-bg: #fff8f0;
        }

        body {
            font-family: 'Courier New', Courier, monospace, "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--main-color);
            margin-bottom: 5px;
            text-shadow: 1px 1px 0px var(--accent-color);
        }

        .subtitle {
            font-size: 0.9rem;
            margin-bottom: 20px;
            color: #666;
        }

        .dashboard {
            display: flex;
            gap: 20px;
            background: var(--card-bg);
            padding: 10px 20px;
            border-radius: 12px;
            border: 2px solid var(--main-color);
            box-shadow: 4px 4px 0px var(--main-color);
            margin-bottom: 20px;
            font-weight: bold;
        }

        .game-container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border: 3px solid var(--main-color);
            border-radius: 16px;
            box-shadow: 6px 6px 0px var(--main-color);
            padding: 20px;
            box-sizing: border-box;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--main-color);
            background: var(--bg-color);
            color: var(--text-color);
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--main-color);
            color: white;
            box-shadow: 2px 2px 0px var(--accent-color);
        }

        .game-panel {
            display: none;
            flex-direction: column;
            align-items: center;
            min-height: 280px;
        }

        .game-panel.active {
            display: flex;
        }

        .customer-box {
            background: #e8d8c8;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }

        .order-speech {
            font-size: 1.2rem;
            color: var(--main-color);
            font-weight: bold;
            margin-top: 5px;
        }

        .record-player {
            width: 90px;
            height: 90px;
            background: #222;
            border-radius: 50%;
            border: 6px solid var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            animation: spin 3s linear infinite paused;
        }

        .record-player.playing {
            animation-play-state: running;
        }

        .record-center {
            width: 25px;
            height: 25px;
            background: var(--main-color);
            border-radius: 50%;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .target-word {
            font-size: 1.8rem;
            letter-spacing: 2px;
            margin: 15px 0;
            font-weight: bold;
        }

        .target-word .matched {
            color: #2e7d32;
            text-decoration: underline;
        }

        .target-word .unmatched {
            color: #888;
        }

        input[type="text"] {
            width: 85%;
            padding: 12px;
            font-size: 1.2rem;
            border: 2px solid var(--main-color);
            border-radius: 8px;
            text-align: center;
            outline: none;
            background: #fff;
        }

        .feedback {
            height: 24px;
            margin-top: 10px;
            font-weight: bold;
            color: var(--main-color);
        }

        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 12px;
            background: #e8d8c8;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .btn {
            background: var(--accent-color);
            border: 2px solid var(--main-color);
            padding: 8px 16px;
            color: white;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>

    <div class="game-container">

        <div id="music-panel" class="game-panel">
            <div id="shop-view" style="width: 100%;">

                </div>
                <div>🎵 正在播放：Plastic Love (City Pop)</div>
                <div class="target-word" id="music-target"></div>
                <input type="text" id="music-input" placeholder="跟著音樂節奏輸入歌詞..." autocomplete="off">
                <div class="feedback" id="music-feedback"></div>
            </div>
        </div>
    </div>
